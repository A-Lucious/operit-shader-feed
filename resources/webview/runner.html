<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Shader Feed</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      /* 画布铺满。deck 用 clientWidth/clientHeight × devicePixelRatio × 画质档
         反推 drawingBuffer 尺寸，所以这里必须是真实的布局尺寸，不能用 CSS 缩放糊。 */
      #gl {
        display: block;
        width: 100vw;
        height: 100vh;
        /* 关键：不加这条，浏览器会把竖向触摸当成滚动手势吃掉，
           我们收不到 pointermove，页面侧滑动检测直接失效。 */
        touch-action: none;
      }
      /* 状态条：真机上编译报错只能靠它看，所以必须可选中可复制，
         并且限制高度避免把画面顶掉。空的时候不占位。 */
      #status {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        margin: 0;
        padding: 6px 10px;
        max-height: 38vh;
        overflow: auto;
        font:
          12px/1.45 ui-monospace,
          Menlo,
          Consolas,
          monospace;
        color: #9fe8ff;
        background: rgba(0, 0, 0, 0.62);
        white-space: pre-wrap;
        word-break: break-word;
        -webkit-user-select: text;
        user-select: text;
      }
      #status:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <!--
      这个页面**不含任何外链**，只负责提供 DOM。
      deck 的源码在编译期被 tools/embed-runner.mjs 内联到下面那个 script 标签里，
      整页随 ToolPkg 一起走，所以运行时不碰网络、不碰文件系统、不碰资源拦截。

      为什么不用外链（真机实测逼出来的）：
        原先写成 <script src="runner.js"> + 虚拟域资源拦截，真机上 WebView 没走拦截，
        去真网络找 shaderfeed.local，报 net::ERR_CONNECTION_CLOSED，整条链路全断。

      内联的唯一坑是 deck 源码里不能出现 script 结束标签的字面文本（会把标签提前闭合），
      tools/embed-runner.mjs 会检查这一点，所以这里也不写出那个字面文本。

      脚本必须放在 body 结束标签之前：deck 的 IIFE 末尾会立刻回调 ShaderHost.ready()，
      而宿主收到 ready() 后马上就会发起 __runnerLoad，那时 #gl 必须已经在文档里。
    -->
    <canvas id="gl"></canvas>
    <pre id="status"></pre>
    <script src="runner.js"></script>
  </body>
</html>
