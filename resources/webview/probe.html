<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Shader 流 · 硬件测量</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1020;
        --panel: #141a30;
        --line: #2a3352;
        --text: #eef1fb;
        --muted: #9aa6cc;
        --accent: #5cc8ff;
        --warn: #ffb45c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 12px;
        background: var(--bg);
        color: var(--text);
        font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
        font-size: 14px;
        line-height: 1.6;
      }
      h1 { font-size: 17px; margin: 0 0 4px; }
      h2 { font-size: 15px; margin: 18px 0 6px; color: var(--accent); }
      p.hint { margin: 0 0 10px; color: var(--muted); font-size: 12px; }
      button {
        font: inherit;
        font-weight: 700;
        padding: 10px 16px;
        margin: 0 8px 8px 0;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: #0b1020;
      }
      button[disabled] { opacity: 0.45; }
      button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
      #stage {
        width: 100%;
        height: 42vh;
        min-height: 180px;
        margin: 8px 0;
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
        background: #000;
        position: relative;
      }
      #stage canvas { width: 100%; height: 100%; display: block; }
      #stageNote {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--muted);
        font-size: 13px;
        text-align: center;
        padding: 12px;
      }
      pre {
        margin: 8px 0 0;
        padding: 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        white-space: pre-wrap;
        word-break: break-word;
        -webkit-user-select: text;
        user-select: text;
        font-size: 12px;
      }
      #progress { margin-top: 8px; color: var(--warn); font-weight: 700; min-height: 22px; }
    </style>
  </head>
  <body>
    <h1>Shader 流 · 硬件测量页</h1>
    <p class="hint">
      这是 P0 的 spike 工具，只测硬件，不依赖 deck。结果可直接长按选中复制。
    </p>

    <h2>G3 · 同时存在的 WebGL context 上限</h2>
    <p class="hint">页面加载后自动开始。数量决定了「预热下两条」能用 3 个常驻 context（β）还是必须单 context 热替换（α）。</p>
    <pre id="outG3">测量中…</pre>

    <h2>G4 · 各画质档实测帧率</h2>
    <p class="hint">
      手写 raymarching（96 步 + 法线求值），三档各跑 60 秒，档间冷却 5 秒。<br />
      「前 10 秒」与「后 10 秒」的差值就是降频信号——差值越大，说明持续渲染会掉速。
    </p>
    <button id="btnG4" disabled>开始 G4（约 3 分 15 秒）</button>
    <button id="btnSelect" class="ghost">全选结果</button>
    <div id="progress"></div>
    <div id="stage"><div id="stageNote">G4 未开始</div></div>
    <pre id="outG4">尚未测量。</pre>

    <script>
      (function () {
        "use strict";

        var SCALES = [0.5, 0.75, 1.0];
        var SCALE_SECONDS = 60;
        var COOLDOWN_SECONDS = 5;
        var CONTEXT_PROBE_LIMIT = 64;

        var result = { g3: null, g4: [] };
        window.__probeResult = result;

        function el(id) { return document.getElementById(id); }

        function sleep(ms) {
          return new Promise(function (resolve) { setTimeout(resolve, ms); });
        }

        function publish(section) {
          var text = JSON.stringify(result, null, 2);
          window.__probeResult = result;
          if (window.console && console.log) {
            console.log("[probe/" + section + "] " + text);
          }
          var host = window.ShaderHost;
          if (host && typeof host.report === "function") {
            try { host.report(JSON.stringify({ kind: "probe", section: section, result: result })); }
            catch (e) { /* 宿主不可用就忽略 */ }
          }
        }

        // ------------------------------------------------------------ G3

        function releaseG3Contexts() {
          var held = window.__g3Contexts || [];
          for (var i = 0; i < held.length; i++) {
            try {
              var lose = held[i].gl.getExtension("WEBGL_lose_context");
              if (lose) { lose.loseContext(); }
            } catch (e) { /* 释放失败不影响后续测量 */ }
          }
          window.__g3Contexts = [];
        }

        /**
         * G3 的关键陷阱：Chrome 在超出 context 上限时**不会**让 getContext 返回 null，
         * 而是静默驱逐最旧的那个（触发 webglcontextlost）。
         * 所以只数「成功创建了几个」会永远数到探测上限，测不出真实上限。
         * 必须监听 webglcontextlost：第一个被驱逐发生时的创建序号 = 可持续的 context 数。
         */
        async function runG3() {
          var held = [];
          var lostIndices = [];
          var failure = "";
          var created = 0;

          for (var i = 0; i < CONTEXT_PROBE_LIMIT; i++) {
            var canvas = document.createElement("canvas");
            canvas.width = 64;
            canvas.height = 64;

            (function (index, cv) {
              cv.addEventListener("webglcontextlost", function (event) {
                if (event && typeof event.preventDefault === "function") {
                  event.preventDefault();
                }
                if (lostIndices.indexOf(index) === -1) { lostIndices.push(index); }
              }, false);
            })(i + 1, canvas);

            try {
              var gl = canvas.getContext("webgl2") || canvas.getContext("webgl");
              if (!gl) {
                failure = "第 " + (i + 1) + " 次 getContext 返回 null";
                break;
              }
              held.push({ canvas: canvas, gl: gl });
              created = i + 1;
            } catch (e) {
              failure = "第 " + (i + 1) + " 次 getContext 抛错: " + (e && e.message ? e.message : e);
              break;
            }

            // 给事件循环机会投递 webglcontextlost，否则驱逐会被漏掉。
            await sleep(60);
            if (lostIndices.length > 0) { break; }
          }

          // 持有引用，避免 context 被 GC 掉导致计数失真。
          window.__g3Contexts = held;

          // 基本信息**不能**从 held[0] 读：那正是被驱逐的那一个，而 lost 的 context
          // 上所有 getParameter() 都返回 null（实测 VERSION/RENDERER/MAX_* 全变 null）。
          // 新建一个干净的 context 来读，失败再用最后一个仍存活的兜底。
          var infoCanvas = document.createElement("canvas");
          infoCanvas.width = 4;
          infoCanvas.height = 4;
          var gl0 = infoCanvas.getContext("webgl2") || infoCanvas.getContext("webgl");
          if (!gl0) {
            for (var hi = held.length - 1; hi >= 0; hi--) {
              if (held[hi].gl && !held[hi].gl.isContextLost()) { gl0 = held[hi].gl; break; }
            }
          }

          function param(name) {
            if (!gl0) { return null; }
            try { return gl0.getParameter(gl0[name]); }
            catch (e) { return "读取失败: " + (e && e.message ? e.message : e); }
          }

          var renderer = "(不可用)";
          var webgl2 = false;
          if (gl0) {
            var dbg = gl0.getExtension("WEBGL_debug_renderer_info");
            renderer = dbg
              ? String(gl0.getParameter(dbg.UNMASKED_RENDERER_WEBGL))
              : "(无 WEBGL_debug_renderer_info)";
            webgl2 = typeof WebGL2RenderingContext !== "undefined" && gl0 instanceof WebGL2RenderingContext;
          }

          // 驱逐发生在创建第 i+1 个时，说明浏览器只肯保留 i 个。
          // 驱逐发生 = 同时可存活的 context 数是 created-1。
          // （evictionObservedAt 是「被驱逐的那个 context 的创建序号」，不是「创建第几个时发生的」）
          var sustainable = lostIndices.length > 0 ? created - 1 : null;

          result.g3 = {
            kind: "G3",
            webgl2Available: webgl2,
            sustainableContexts: sustainable,
            evictionObservedAt: lostIndices.length > 0 ? Math.min.apply(null, lostIndices) : null,
            contextsCreated: created,
            hitProbeLimit: lostIndices.length === 0 && created === CONTEXT_PROBE_LIMIT && !failure,
            failure: failure || "(未触发失败)",
            version: param("VERSION"),
            renderer: renderer,
            maxTextureImageUnits: param("MAX_TEXTURE_IMAGE_UNITS"),
            maxRenderbufferSize: param("MAX_RENDERBUFFER_SIZE"),
            maxVertexUniformVectors: param("MAX_VERTEX_UNIFORM_VECTORS"),
            maxFragmentUniformVectors: param("MAX_FRAGMENT_UNIFORM_VECTORS"),
            devicePixelRatio: window.devicePixelRatio || 1
          };

          var limitLine;
          if (sustainable !== null) {
            limitLine = "可持续 context 数: " + sustainable
              + "（创建到第 " + created + " 个时，第 " + result.g3.evictionObservedAt + " 个被驱逐）";
          } else if (result.g3.hitProbeLimit) {
            limitLine = "可持续 context 数: 探测上限 " + CONTEXT_PROBE_LIMIT + " 内未观察到驱逐（真实上限 >= " + CONTEXT_PROBE_LIMIT + "）";
          } else {
            limitLine = "可持续 context 数: 未能测定（getContext 先失败了）";
          }

          el("outG3").textContent = [
            limitLine,
            "创建总数: " + created + "   失败: " + result.g3.failure,
            "",
            "→ 若 >= 3，P4 可用 β（3 个 WebView 常驻）；若 < 3，必须走 α（单 context 热替换）。",
            "",
            "WebGL2 可用: " + result.g3.webgl2Available,
            "VERSION: " + result.g3.version,
            "RENDERER: " + result.g3.renderer,
            "MAX_TEXTURE_IMAGE_UNITS: " + result.g3.maxTextureImageUnits,
            "MAX_RENDERBUFFER_SIZE: " + result.g3.maxRenderbufferSize,
            "MAX_VERTEX_UNIFORM_VECTORS: " + result.g3.maxVertexUniformVectors,
            "MAX_FRAGMENT_UNIFORM_VECTORS: " + result.g3.maxFragmentUniformVectors,
            "devicePixelRatio: " + result.g3.devicePixelRatio
          ].join("\n");

          publish("G3");
        }

        // ------------------------------------------------------------ G4

        var VERTEX_SRC = [
          "attribute vec2 aPos;",
          "void main() { gl_Position = vec4(aPos, 0.0, 1.0); }"
        ].join("\n");

        // 刻意写重：96 步 raymarching，每步求 SDF，命中后还要采样法线（再 6 次）。
        var FRAGMENT_SRC = [
          "precision highp float;",
          "uniform vec2 uRes;",
          "uniform float uTime;",
          "float sdBox(vec3 p, vec3 b) {",
          "  vec3 q = abs(p) - b;",
          "  return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);",
          "}",
          "float map(vec3 p) {",
          "  vec3 q = mod(p + 1.0, 2.0) - 1.0;",
          "  float d = sdBox(q, vec3(0.42));",
          "  d = min(d, length(p - vec3(0.0, sin(uTime * 0.7) * 0.6, 0.0)) - 0.7);",
          "  return d;",
          "}",
          "vec3 calcNormal(vec3 p) {",
          "  vec2 e = vec2(0.0015, 0.0);",
          "  return normalize(vec3(",
          "    map(p + e.xyy) - map(p - e.xyy),",
          "    map(p + e.yxy) - map(p - e.yxy),",
          "    map(p + e.yyx) - map(p - e.yyx)",
          "  ));",
          "}",
          "void main() {",
          "  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;",
          "  float a = uTime * 0.25;",
          "  vec3 ro = vec3(2.8 * cos(a), 1.6, 2.8 * sin(a));",
          "  vec3 fw = normalize(-ro);",
          "  vec3 rt = normalize(cross(vec3(0.0, 1.0, 0.0), fw));",
          "  vec3 up = cross(fw, rt);",
          "  vec3 rd = normalize(uv.x * rt + uv.y * up + 1.7 * fw);",
          "  float t = 0.0;",
          "  float glow = 0.0;",
          "  bool hit = false;",
          "  for (int i = 0; i < 96; i++) {",
          "    vec3 p = ro + rd * t;",
          "    float d = map(p);",
          "    glow += 0.012 / (0.05 + d * d);",
          "    if (d < 0.002) { hit = true; break; }",
          "    if (t > 26.0) { break; }",
          "    t += d * 0.85;",
          "  }",
          "  vec3 col = vec3(0.02, 0.03, 0.06) + glow * vec3(0.25, 0.45, 0.9) * 0.02;",
          "  if (hit) {",
          "    vec3 p = ro + rd * t;",
          "    vec3 n = calcNormal(p);",
          "    float dif = max(dot(n, normalize(vec3(0.6, 0.8, 0.4))), 0.0);",
          "    col = mix(vec3(0.05, 0.07, 0.12), vec3(0.92, 0.76, 0.55), dif);",
          "  }",
          "  col = pow(col, vec3(0.4545));",
          "  gl_FragColor = vec4(col, 1.0);",
          "}"
        ].join("\n");

        function compile(gl, type, source) {
          var sh = gl.createShader(type);
          gl.shaderSource(sh, source);
          gl.compileShader(sh);
          if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
            var log = gl.getShaderInfoLog(sh);
            gl.deleteShader(sh);
            throw new Error("shader 编译失败: " + log);
          }
          return sh;
        }

        function setupGl(canvas) {
          var gl = canvas.getContext("webgl2") || canvas.getContext("webgl");
          if (!gl) { throw new Error("无法创建 WebGL 上下文"); }
          var vs = compile(gl, gl.VERTEX_SHADER, VERTEX_SRC);
          var fs = compile(gl, gl.FRAGMENT_SHADER, FRAGMENT_SRC);
          var program = gl.createProgram();
          gl.attachShader(program, vs);
          gl.attachShader(program, fs);
          gl.linkProgram(program);
          if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            throw new Error("program 链接失败: " + gl.getProgramInfoLog(program));
          }
          gl.useProgram(program);
          var buf = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, buf);
          gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
          var aPos = gl.getAttribLocation(program, "aPos");
          gl.enableVertexAttribArray(aPos);
          gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
          return {
            gl: gl,
            uRes: gl.getUniformLocation(program, "uRes"),
            uTime: gl.getUniformLocation(program, "uTime")
          };
        }

        function average(values) {
          if (!values.length) { return 0; }
          var sum = 0;
          for (var i = 0; i < values.length; i++) { sum += values[i]; }
          return sum / values.length;
        }

        function round1(value) { return Math.round(value * 10) / 10; }

        function measureScale(scale) {
          return new Promise(function (resolve, reject) {
            var stage = el("stage");
            stage.innerHTML = "";
            var note = document.createElement("div");
            note.id = "stageNote";
            note.textContent = "缩放 " + scale + " · 准备中";
            stage.appendChild(note);

            var viewportW = stage.clientWidth || 360;
            var viewportH = stage.clientHeight || 240;
            var dpr = window.devicePixelRatio || 1;

            var canvas = document.createElement("canvas");
            canvas.width = Math.max(2, Math.round(viewportW * dpr * scale));
            canvas.height = Math.max(2, Math.round(viewportH * dpr * scale));
            stage.appendChild(canvas);

            var ctx;
            try {
              ctx = setupGl(canvas);
            } catch (e) {
              reject(e);
              return;
            }

            ctx.gl.uniform2f(ctx.uRes, canvas.width, canvas.height);

            var samples = [];
            var frames = 0;
            var lastSecond = performance.now();
            var startedAt = lastSecond;

            function frame(now) {
              ctx.gl.uniform1f(ctx.uTime, (now - startedAt) / 1000);
              ctx.gl.drawArrays(ctx.gl.TRIANGLE_STRIP, 0, 4);
              frames++;

              var sinceSecond = now - lastSecond;
              if (sinceSecond >= 1000) {
                samples.push(frames / (sinceSecond / 1000));
                frames = 0;
                lastSecond = now;
                note.textContent = "缩放 " + scale + " · 剩余 " +
                  Math.max(0, Math.ceil(SCALE_SECONDS - (now - startedAt) / 1000)) + " 秒";
              }

              if (now - startedAt >= SCALE_SECONDS * 1000) {
                note.remove();
                resolve({
                  scale: scale,
                  bufferWidth: canvas.width,
                  bufferHeight: canvas.height,
                  viewportWidth: viewportW,
                  viewportHeight: viewportH,
                  devicePixelRatio: dpr,
                  sampleCount: samples.length,
                  avgFps: round1(average(samples)),
                  first10sFps: round1(average(samples.slice(0, 10))),
                  last10sFps: round1(average(samples.slice(-10)))
                });
                return;
              }
              requestAnimationFrame(frame);
            }

            requestAnimationFrame(frame);
          });
        }

        function cooldown(seconds) {
          return new Promise(function (resolve) {
            var remaining = seconds;
            var stage = el("stage");
            stage.innerHTML = "";
            var note = document.createElement("div");
            note.id = "stageNote";
            note.textContent = "冷却中 · " + remaining + " 秒";
            stage.appendChild(note);
            var timer = setInterval(function () {
              remaining -= 1;
              if (remaining <= 0) {
                clearInterval(timer);
                resolve();
                return;
              }
              note.textContent = "冷却中 · " + remaining + " 秒";
            }, 1000);
          });
        }

        function renderG4() {
          var lines = [];
          lines.push("devicePixelRatio: " + (window.devicePixelRatio || 1));
          lines.push("");
          for (var i = 0; i < result.g4.length; i++) {
            var r = result.g4[i];
            lines.push("缩放 " + r.scale +
              "  →  缓冲 " + r.bufferWidth + "x" + r.bufferHeight +
              "  视口 " + r.viewportWidth + "x" + r.viewportHeight);
            lines.push("  平均 " + r.avgFps + " fps" +
              "   前10秒 " + r.first10sFps + " fps" +
              "   后10秒 " + r.last10sFps + " fps" +
              "   降幅 " + round1(r.first10sFps - r.last10sFps) + " fps");
            lines.push("");
          }
          el("outG4").textContent = lines.join("\n");
        }

        async function runG4() {
          var button = el("btnG4");
          button.disabled = true;
          result.g4 = [];
          renderG4();

          // G3 已经占满了 context 配额（还被驱逐过），先全部释放，否则 G4 的第一个 context
          // 可能直接创建失败或又把别人挤掉。
          releaseG3Contexts();

          for (var i = 0; i < SCALES.length; i++) {
            if (i > 0) {
              el("progress").textContent = "档间冷却…";
              await cooldown(COOLDOWN_SECONDS);
            }
            var scale = SCALES[i];
            el("progress").textContent = "正在测量缩放 " + scale + "（" + (i + 1) + "/" + SCALES.length + "）";
            try {
              var measurement = await measureScale(scale);
              result.g4.push(measurement);
              renderG4();
              publish("G4:" + scale);
            } catch (e) {
              el("progress").textContent = "缩放 " + scale + " 测量失败: " + (e && e.message ? e.message : e);
              return;
            }
          }

          el("progress").textContent = "测量完成，结果可直接长按复制。";
          publish("G4:done");
        }

        // ------------------------------------------------------------ 绑定

        el("btnG4").addEventListener("click", function () {
          runG4();
        });

        el("btnSelect").addEventListener("click", function () {
          var range = document.createRange();
          range.selectNodeContents(el("outG3"));
          range.setEndAfter(el("outG4"));
          var selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
          el("progress").textContent = "已全选，长按复制即可。";
        });

        runG3()
          .catch(function (e) {
            el("outG3").textContent = "G3 测量失败: " + (e && e.message ? e.message : e);
          })
          .then(function () {
            el("btnG4").disabled = false;
          });
      })();
    </script>
  </body>
</html>
